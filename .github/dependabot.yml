---
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    assignees:
      - thechelsuk
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - thechelsuk
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/"
    assignees:
      - thechelsuk
    schedule:
      interval: "weekly"
    groups:
      chart-js:
        patterns: ["chart.js", "chartjs-*"]
  - package-ecosystem: "bundler"
    directory: "/"
    assignees:
      - thechelsuk
    schedule:
      interval: "weekly"
