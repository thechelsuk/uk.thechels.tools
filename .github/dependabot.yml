---
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    assignees:
      - thechelsuk
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - thechelsuk
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/"
    assignees:
      - thechelsuk
    schedule:
      interval: "weekly"
    groups:
      chart-js:
        patterns: ["chart.js", "chartjs-*"]
    ignore:
      # js-yaml 5 changes YAML output (list indents, quote style); held at 4 until the converter is updated
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "bundler"
    directory: "/"
    assignees:
      - thechelsuk
    schedule:
      interval: "weekly"
