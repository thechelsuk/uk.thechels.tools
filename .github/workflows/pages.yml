# Builds and deploys the site to GitHub Pages.
#
# Steps: install npm libraries -> copy them into assets/vendor and write the
# SBOM -> run tests -> build Jekyll -> deploy.
#
# Requires Settings -> Pages -> Source: "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for "last updated" dates

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install libraries
        run: npm ci

      - name: Vendor libraries and write SBOM (npm, gems, actions)
        run: npm run vendor

      - name: Test
        run: npm test

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
