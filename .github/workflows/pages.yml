name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: thechelsuk/workflows/.github/workflows/pages.yml@main
    with:
      build: jekyll
      pre_build: npm run vendor && npm test
      fetch_depth: 0
