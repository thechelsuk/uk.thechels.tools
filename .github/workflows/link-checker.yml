name: Link Checker
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
  issues: write
jobs:
  links:
    uses: thechelsuk/workflows/.github/workflows/link-checker.yml@main
    with:
      site_host: tools\.thechels\.uk
      ruby_version: "3.3"
      jekyll_args: --baseurl ""
      post_build: npm ci && npm run vendor && JEKYLL_ENV=production bundle exec jekyll build --baseurl ""
